name: QA Automation Pipeline

on:
  workflow_dispatch:

jobs:
  e2e-and-visual-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CURRENTS_PROJECT_ID: ixAdP0
      CURRENTS_RECORD_KEY: ${{ secrets.CURRENTS_RECORD_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests y publicar evidencias
        run: npm run test:ci:dash
        env:
          CI: true
          TEST_ENV: qa
          HEADLESS: true
          RETRIES: 2
          VIDEO: retain-on-failure
          AS_PROJECT: Web
          AS_USER: github-actions
          AS_EXEC_NAME: "CI ${{ github.workflow }} - ${{ github.ref_name }}"
          # Credenciales de Cloudflare R2: si no estan configuradas como Secrets,
          # el paso simplemente omite la subida de evidencias (no falla el job).
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      - name: Upload evidencias (respaldo local del run)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias
          path: evidencias
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/playwright-report
          if-no-files-found: ignore

      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: ignore

      - name: Generate Allure HTML report
        if: always()
        run: npm run report:allure

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: reports/allure-report
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore
